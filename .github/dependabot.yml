version: 2

multi-ecosystem-groups:
  dependency-updates:
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Africa/Addis_Ababa

updates:
  - package-ecosystem: pub
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
    ignore:
      # Majors are upgraded by hand and tested on a device.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: "/android"
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
    ignore:
      - dependency-name: "com.garmin.health:companion-sdk"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: dependency-updates
    ignore:
      # Keep major upgrades separate for manual review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
