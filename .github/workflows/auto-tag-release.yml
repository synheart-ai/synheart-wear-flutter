name: Auto-tag release

on:
  push:
    branches: [release]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Push the release tag with a synheart-release App token, not GITHUB_TOKEN
      # (whose pushes don't trigger publish.yml) or a person-owned PAT (which
      # expires). Scoped to Contents: write on this repo only.
      - name: Mint release token
        id: release-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.SYNHEART_RELEASE_APP_ID }}
          private-key: ${{ secrets.SYNHEART_RELEASE_APP_PRIVATE_KEY }}
          owner: synheart-ai
          repositories: synheart-wear-flutter
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Read pubspec version
        id: ver
        run: |
          version=$(awk '/^version:/ {gsub(/[ \r]/,"",$2); print $2; exit}' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin; skipping. Bump pubspec version to cut a new release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
